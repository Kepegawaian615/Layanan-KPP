<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layanan KPP Pratama Surabaya Rungkut</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
:root {
  --merek: #0E2A47; --merek-2: #173B61; --emas: #F2B705; --emas-teks: #3D2E00; --emas-lembut: #FFF3C9;
  --utama: #0E2A47; --utama-teks: #FFFFFF;
  --dasar: #F2F5F8; --permukaan: #FFFFFF; --teks: #13202E; --teks-2: #4A5868; --garis: #D7DFE7;
  --rona: #E3EBF4; --rona-teks: #0E2A47; --chip: #E8EDF2;
  --ok: #1E6B3A; --ok-bg: #E2EFE6; --awas-bg: #FCEFC7; --awas-teks: #5C4200; --galat: #A12B2B; --galat-bg: #FBE5E5;
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --utama: #3B78BD; --dasar: #0D141C; --permukaan: #16202B; --teks: #E6EDF4; --teks-2: #A7B4C2; --garis: #273646;
  --rona: #1E3047; --rona-teks: #D3E3F5; --chip: #1F2B38; --emas-lembut: #3A3010;
  --ok: #7BD39A; --ok-bg: #16301F; --awas-bg: #3A2F0B; --awas-teks: #F5D77A; --galat: #FF9C9C; --galat-bg: #3A1717;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--dasar); color: var(--teks); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--emas); outline-offset: 2px; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }
.layar { display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.2px; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.kecil { font-size: 13px; color: var(--teks-2); }
.ik { display: inline-flex; width: 22px; height: 22px; flex-shrink: 0; }
.ik svg { width: 100%; height: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- pita merek (beranda) ---------- */
.pita { margin: 0 -16px; padding: 16px 20px 50px; background: var(--merek); color: #FFFFFF; border-bottom: 3px solid var(--emas); }
.kop { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.logo-baris { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.logo { height: 56px; min-width: 56px; padding: 4px; border-radius: 14px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
.logo img { height: 48px; width: auto; max-width: 132px; object-fit: contain; display: block; border-radius: 10px; }
.kop-teks { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin: 0; font-weight: 400; }
.kop-teks b { font-size: 17px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.2px; line-height: 1.2; }
.kop-teks span { font-size: 13px; color: #C9D6E3; line-height: 1.3; }
.monogram { width: 56px; height: 56px; border-radius: 12px; background: rgba(255,255,255,.1); color: var(--emas); display: grid; place-items: center; font-weight: 800; font-size: 14px; letter-spacing: .5px; }
.salam { font-size: 15px; color: #C9D6E3; margin: 0; }
.salam b { font-size: 18px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.2px; margin-left: 4px; }
.kantor { margin-top: 10px; font-size: 14px; font-weight: 600; color: #E3EBF4; display: flex; align-items: center; gap: 8px; }
.kantor::before { content: ''; width: 18px; height: 2px; background: var(--emas); border-radius: 2px; }

/* kepala layar lain */
.kepala { padding: 18px 0 2px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- karcis antrean (elemen khas) ---------- */
.karcis { position: relative; display: grid; grid-template-columns: 124px minmax(0, 1fr); background: var(--permukaan); border-radius: 18px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(14,42,71,.08), 0 8px 24px rgba(14,42,71,.10); }
.karcis::before, .karcis::after { content: ''; position: absolute; left: 113px; width: 22px; height: 22px; border-radius: 50%; background: var(--dasar); }
.karcis::before { top: -11px; }
.karcis::after { bottom: -11px; }
.karcis-kiri { background: var(--emas); color: var(--merek); padding: 16px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.karcis-kiri .kecil { color: #5C4200; font-size: 11px; font-weight: 700; }
.karcis-kiri .nomor { font-size: 32px; color: var(--merek); font-weight: 800; letter-spacing: 0; }
.karcis-kanan { padding: 14px 16px 14px 20px; border-left: 2px dashed rgba(14,42,71,.25); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ditimpa { margin-top: -40px; }
.karcis.ditimpa::before { background: var(--merek); }
:root[data-theme="dark"] .karcis, :root[data-theme="dark"] .karcis-tegak { border: 1px solid var(--garis); }
.nomor { font-family: var(--mono); font-weight: 700; letter-spacing: .5px; }

.langkah { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.langkah span { font-size: 11px; font-weight: 600; color: var(--teks-2); padding-top: 6px; border-top: 3px solid var(--garis); }
.langkah span.lewat { color: var(--teks); border-color: var(--merek); }
:root[data-theme="dark"] .langkah span.lewat { border-color: var(--emas); }
.langkah span.kini { color: var(--teks); border-color: var(--emas); }

/* karcis tegak (setelah kirim formulir) */
.karcis-tegak { position: relative; background: var(--permukaan); border-radius: 20px; overflow: hidden; box-shadow: 0 1px 2px rgba(14,42,71,.08), 0 10px 30px rgba(14,42,71,.12); }
.karcis-tegak .atas { background: var(--emas); color: var(--merek); padding: 22px 20px 26px; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.karcis-tegak .atas .nomor { font-size: 60px; color: var(--merek); font-weight: 800; line-height: 1.1; }
.karcis-tegak .atas .kecil { color: #5C4200; font-weight: 700; }
.karcis-tegak .bawah { padding: 18px 20px 20px; border-top: 2px dashed var(--garis); position: relative; }
.karcis-tegak .bawah::before, .karcis-tegak .bawah::after { content: ''; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--dasar); }
.karcis-tegak .bawah::before { left: -11px; }
.karcis-tegak .bawah::after { right: -11px; }
.rinci { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; font-size: 14px; margin: 0; }
.rinci dt { color: var(--teks-2); }
.rinci dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

/* ---------- tombol utama ambil antrean ---------- */
.cta { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-radius: 18px; text-align: left; cursor: pointer;
  background: var(--permukaan); border: 2px solid var(--emas); box-shadow: 0 10px 24px rgba(14, 42, 71, .16); }
.cta .lingkar-ik { width: 52px; height: 52px; border-radius: 14px; background: var(--emas); color: var(--merek); display: grid; place-items: center; flex-shrink: 0; }
.cta .lingkar-ik .ik { width: 26px; height: 26px; }
.cta b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }
.cta small { display: block; font-size: 13px; color: var(--teks-2); line-height: 1.4; margin-top: 2px; }
.cta .panah { margin-left: auto; width: 34px; height: 34px; border-radius: 17px; background: var(--rona); color: var(--rona-teks); display: grid; place-items: center; flex-shrink: 0; }
.cta:active { transform: scale(.99); }
.cta.timpa { margin-top: -38px; }
.ubin-baris { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ubin-baris .ubin { flex-direction: row; min-height: 64px; padding: 10px 12px; gap: 10px; align-items: center; justify-content: flex-start; text-align: left; }
.ubin-baris .ubin .lingkar-ik { width: 38px; height: 38px; flex-shrink: 0; }
.ubin-baris .ubin b { font-size: 14px; line-height: 1.25; }
.ubin-baris .lencana-ubin { top: 50%; transform: translateY(-50%); right: 10px; }

/* kalkulator */
.kalk-hasil { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: var(--emas-lembut); }
.kalk-hasil .besar { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; color: var(--teks); font-variant-numeric: tabular-nums; }
.kalk-hasil dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 4px 0 0; font-size: 14px; }
.kalk-hasil dt { color: var(--teks-2); }
.kalk-hasil dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.kalk-catatan { font-size: 13px; color: var(--teks-2); line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }

/* penilaian */
.bintang-baris { display: flex; justify-content: center; gap: 6px; }
.bintang-baris button { width: 54px; height: 54px; border-radius: 14px; border: 1px solid var(--garis); background: var(--permukaan); font-size: 28px; line-height: 1; cursor: pointer; color: var(--garis); }
.bintang-baris button[aria-checked="true"], .bintang-baris button.nyala { color: var(--emas); border-color: var(--emas); background: var(--emas-lembut); }
.label-nilai { text-align: center; font-weight: 700; min-height: 22px; }
@media (prefers-reduced-motion: reduce) { .cta:active { transform: none; } }

/* ---------- ubin menu ---------- */
.ubin-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ubin { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 118px; padding: 14px; border-radius: 16px;
  border: 1px solid var(--garis); background: var(--permukaan); text-align: left; cursor: pointer; }
.ubin:active { transform: scale(.98); }
.ubin .lingkar-ik { width: 40px; height: 40px; border-radius: 12px; background: var(--rona); color: var(--rona-teks); display: grid; place-items: center; }
.ubin b { display: block; font-size: 15px; }
.ubin small { display: block; font-size: 12px; color: var(--teks-2); line-height: 1.4; margin-top: 2px; }
.ubin.utama { background: var(--merek); border-color: var(--merek); color: #FFFFFF; }
.ubin.utama .lingkar-ik { background: var(--emas); color: var(--merek); }
.ubin.utama small { color: #C9D6E3; }
.lencana-ubin { position: absolute; top: 12px; right: 12px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--emas); color: var(--emas-teks); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
@media (prefers-reduced-motion: reduce) { .ubin:active { transform: none; } }

.judul-bagian { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: -6px; }
.judul-bagian h3 { font-size: 13px; color: var(--teks-2); font-weight: 700; }

/* ---------- kartu & daftar ---------- */
.kartu { background: var(--permukaan); border: 1px solid var(--garis); border-radius: 16px; padding: 16px; }
.daftar { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; background: var(--permukaan); border: 1px solid var(--garis); border-radius: 14px; text-align: left; cursor: pointer; }
.item-isi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-judul { font-weight: 700; }
.panah { color: var(--teks-2); }
.lencana { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--teks-2); }
.lencana.baru { background: var(--emas); color: var(--emas-teks); }
.lencana.tunggu { background: var(--awas-bg); color: var(--awas-teks); }
.lencana.layani { background: var(--rona); color: var(--rona-teks); }
.sorot { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border-radius: 16px; background: var(--emas-lembut); border: 1px solid transparent; text-align: left; cursor: pointer; }
.sorot .item-judul { font-size: 14px; }

.kontak { display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.medsos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.medsos button { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 96px; padding: 12px 6px; border-radius: 14px; border: 1px solid var(--garis); background: var(--permukaan); text-align: center; cursor: pointer; min-width: 0; }
.medsos .logo-medsos { width: 40px; height: 40px; border-radius: 12px; object-fit: contain; display: block; }
.medsos .lingkar-ik { width: 40px; height: 40px; border-radius: 12px; background: var(--rona); color: var(--rona-teks); display: grid; place-items: center; }
.medsos .lingkar-ik .ik { width: 20px; height: 20px; }
.medsos b { display: block; font-size: 12px; line-height: 1.25; }
.medsos small { display: block; max-width: 100%; font-size: 11px; color: var(--teks-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aksi-karcis { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tombol-kecil { min-height: 40px; padding: 0 14px; border-radius: 12px; font-size: 13px; }
.kontak-baris { display: flex; gap: 10px; align-items: flex-start; }
.kontak-baris .ik { width: 18px; height: 18px; margin-top: 2px; color: var(--teks-2); }
.tautan { background: none; border: none; padding: 0; color: var(--utama); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- tombol & isian ---------- */
.tombol { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; text-decoration: none; }
.tombol-utama { background: var(--utama); color: var(--utama-teks); }
.tombol-kedua { background: var(--rona); color: var(--rona-teks); }
.tombol-garis { background: transparent; color: var(--teks); border: 1px solid var(--garis); }
.tombol-bahaya { background: var(--galat-bg); color: var(--galat); }
.tombol[disabled] { opacity: .6; cursor: default; }
.lebar { width: 100%; }
.deret { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.bagian { display: flex; flex-direction: column; gap: 14px; }
.bagian-judul { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
.bagian-judul .no { width: 26px; height: 26px; border-radius: 13px; background: var(--merek); color: var(--emas); display: grid; place-items: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
:root[data-theme="dark"] .bagian-judul .no { background: var(--emas); color: var(--merek); }
.bidang { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 13px; font-weight: 600; color: var(--teks-2); }
.isian { width: 100%; min-height: 50px; padding: 11px 13px; border: 1px solid var(--garis); border-radius: 12px; background: var(--permukaan); font-size: 16px; }
.isian:focus { border-color: var(--utama); }
textarea.isian { min-height: 104px; resize: vertical; line-height: 1.45; }
.isian.mono { font-family: var(--mono); letter-spacing: .5px; }
.isian.besar { font-size: 20px; font-weight: 700; }
.isian[aria-invalid="true"] { border-color: var(--galat); }
.isian.valid { border-color: var(--ok); }
.bantuan { font-size: 12px; color: var(--teks-2); }
.bantuan.ok { color: var(--ok); font-weight: 700; }
.salah { font-size: 13px; color: var(--galat); font-weight: 700; }
.salah:empty { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--garis); background: var(--permukaan); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { background: var(--utama); border-color: var(--utama); color: var(--utama-teks); }
.chip-gulir { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.chip-gulir::-webkit-scrollbar { display: none; }
.chip-gulir .chip { flex-shrink: 0; min-height: 40px; }
.segmen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--chip); border-radius: 12px; }
.segmen button { min-height: 44px; border: none; border-radius: 9px; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; }
.segmen button[aria-checked="true"] { background: var(--permukaan); color: var(--rona-teks); font-weight: 800; box-shadow: 0 0 0 1px var(--garis); }
.centang { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; }
.centang input { width: 20px; height: 20px; margin: 0; accent-color: var(--utama); }
.stepper { display: grid; grid-template-columns: 50px minmax(0, 1fr) 50px; gap: 8px; max-width: 230px; }
.langkah-btn { min-height: 50px; padding: 0; font-size: 22px; }
.isian.angka { text-align: center; font-weight: 800; font-size: 18px; -moz-appearance: textfield; }
.isian.angka::-webkit-inner-spin-button, .isian.angka::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.petunjuk-loket { font-size: 13px; color: var(--teks-2); }
.petunjuk-loket b { color: var(--teks); }

.kaki { position: sticky; bottom: 0; margin: 4px -16px -28px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--dasar); border-top: 1px solid var(--garis); display: flex; flex-direction: column; gap: 8px; z-index: 2; }

.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.banner-awas { background: var(--awas-bg); color: var(--awas-teks); }
.banner-galat { background: var(--galat-bg); color: var(--galat); font-weight: 700; }
.banner-ok { background: var(--ok-bg); color: var(--ok); }

.cari { position: relative; }
.cari .ik { position: absolute; left: 13px; top: 15px; width: 20px; height: 20px; color: var(--teks-2); pointer-events: none; }
.cari input { padding-left: 44px; }
.isi-faq { display: flex; flex-direction: column; gap: 10px; }
.isi-faq ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.pra { white-space: pre-line; }
.dasar { font-size: 13px; padding: 9px 12px; border-radius: 10px; background: var(--rona); color: var(--rona-teks); font-weight: 600; }
.lingkar { width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center; }
.lingkar .ik { width: 28px; height: 28px; }

/* persyaratan */
.grup-judul { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--teks-2); margin: 6px 0 -2px; }
.grup-judul .jumlah { font-weight: 700; color: var(--teks-2); background: var(--chip); border-radius: 10px; padding: 0 8px; font-size: 12px; }
.blok { display: flex; flex-direction: column; gap: 12px; }
.blok-judul { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.blok-judul h3 { display: flex; align-items: center; gap: 8px; }
.blok-judul h3 .ik { width: 20px; height: 20px; color: var(--utama); }
.cek-daftar { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cek-daftar li + li { border-top: 1px solid var(--garis); }
.cek-daftar label { display: flex; align-items: flex-start; gap: 12px; padding: 12px 2px; cursor: pointer; line-height: 1.45; }
.cek-daftar input { width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: var(--ok); }
.cek-daftar li.sub label { padding-left: 34px; font-size: 14px; color: var(--teks-2); }
.cek-daftar input:checked + span { color: var(--teks-2); text-decoration: line-through; text-decoration-color: var(--garis); }
.progres { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.progres span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .progres span { transition: none; } }
.langkah-daftar { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: lk; }
.langkah-daftar li { counter-increment: lk; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; line-height: 1.45; }
.langkah-daftar li::before { content: counter(lk); width: 28px; height: 28px; border-radius: 14px; background: var(--rona); color: var(--rona-teks); font-weight: 800; font-size: 13px; display: grid; place-items: center; }

/* ---------- utilitas ---------- */
function h(tag, props) {
  const el = document.createElement(tag);

      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);

  for (let i = 2; i < arguments.length; i++) tambahAnak(el, arguments[i]);
  return el;
}
function tambahAnak(el, a) {
  if (a === null || a === undefined || a === false) return;

function namaDepan() { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; return (u && u.first_name) || 'Bapak/Ibu'; }

function digit(s) { return String(s || '').replace(/\D/g, ''); }
function kelompok(s, pola) {
  const d = digit(s); const out = []; let i = 0;
  for (const n of pola) { if (i >= d.length) break; out.push(d.slice(i, i + n)); i += n; }
  if (i < d.length) out.push(d.slice(i));
  return out.join(' ');
}
function rupiah(s) { const d = digit(s); return d ? 'Rp' + d.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : ''; }
function tglJam(dt) {
  const d = new Date(dt); if (isNaN(d)) return '-';
  return d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear() + ', ' + String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');
}

  } catch (e) {}

}

async function api(aksi, data) {

function isiTerformat(teks) {
  // "## judul" → subjudul, "1. ..." → langkah, "• ..." → poin, lainnya → paragraf
  const wadah = h('div', { class: 'isi-faq' });
  let daftar = null; let jenis = '';
  String(teks || '').split('\n').forEach(baris => {
    const t = baris.trim(); if (!t) return;
    if (/^##\s+/.test(t)) { daftar = null; wadah.append(h('h3', { text: t.replace(/^##\s+/, '') })); return; }
    const nomor = /^\d+[.)]\s+/.test(t); const poin = /^[•\-*]\s*/.test(t);
    if (nomor || poin) {
      const j2 = nomor ? 'ol' : 'ul';
      if (!daftar || jenis !== j2) { daftar = h(j2); jenis = j2; wadah.append(daftar); }
      daftar.append(h('li', { text: t.replace(nomor ? /^\d+[.)]\s+/ : /^[•\-*]\s*/, '') }));
      return;
    }
    daftar = null; wadah.append(h('p', { text: t }));
  });
  return wadah;
}

      h('span', { class: 'lencana' + (f.kategori === 'Terbaru' ? ' baru' : ''), text: f.kategori || 'Umum' }),
      h('h2', { text: f.judul }),
      f.ringkasan ? h('p', { class: 'kecil', text: f.ringkasan }) : null),
    f.dasar ? h('p', { class: 'dasar', text: 'Dasar: ' + f.dasar }) : null,
    h('section', { class: 'kartu' }, isiTerformat(f.isi)),
    f.diperbarui ? h('p', { class: 'kecil', text: 'Diperbarui: ' + f.diperbarui }) : null,
    h('div', { class: 'deret' },
      /^https?:\/\//.test(f.sumber) ? h('button', { class: 'tombol tombol-kedua', onClick: () => bukaTautan(f.sumber) }, 'Sumber', ikon('tautan')) : null,
      h('button', { class: 'tombol tombol-utama', onClick: () => buka('form', { layanan: kodeLayanan('K'), uraian: 'Pertanyaan tentang: ' + f.judul + '\n' }) }, 'Tanya petugas')),
    h('p', { class: 'kecil', text: 'Ringkasan ini informasi umum, bukan pendapat atas kasus tertentu.' }));
};
function kodeLayanan(kode) { return S.data.layanan.some(l => l.kode === kode) ? kode : ''; }

/* ---------- persyaratan ---------- */
LAYAR.syarat = function () {
  const k = S.data.kantor;
  const daftar = h('div', { class: 'daftar' });
  const urutanKat = [];
  S.data.syarat.forEach(x => { if (urutanKat.indexOf(x.kategori) < 0) urutanKat.push(x.kategori); });
  const isi = q => {
    const kata = q.trim().toLowerCase();
    const hasil = S.data.syarat.filter(x => !kata || (x.layanan + ' ' + x.ringkasan + ' ' + x.syarat + ' ' + x.cara).toLowerCase().includes(kata));
    if (!hasil.length) { daftar.replaceChildren(h('p', { class: 'kecil', text: 'Tidak ada layanan yang cocok. Coba kata lain.' })); return; }
    const anak = [];
    urutanKat.forEach(kat => {
      const di = hasil.filter(x => x.kategori === kat);
      if (!di.length) return;
      anak.push(h('div', { class: 'grup-judul' }, h('span', { text: kat }), h('span', { class: 'jumlah', text: String(di.length) })));
      di.forEach(x => anak.push(h('button', { class: 'item', onClick: () => buka('syaratDetail', x) },
        h('span', { class: 'item-isi' }, h('span', { class: 'item-judul', text: x.layanan }), x.ringkasan ? h('span', { class: 'kecil', text: x.ringkasan }) : null),
        h('span', { class: 'panah' }, ikon('panah')))));
    });
    daftar.replaceChildren(...anak);
  };
  isi('');
  return h('main', { class: 'layar' },
    kepala('Persyaratan dokumen', 'Pilih permohonan untuk melihat dokumen yang disiapkan dan cara mengajukannya.'),
    h('div', { class: 'cari' }, ikon('cari'), h('input', { class: 'isian', type: 'search', placeholder: 'Cari: NPWP, PKP, pemindahbukuan…', 'aria-label': 'Cari layanan', onInput: e => isi(e.target.value) })),
    daftar,
    h('button', { class: 'tombol tombol-kedua lebar', onClick: () => bukaTautan(k.formulir) }, 'Unduh formulir permohonan', ikon('tautan')));
};
LAYAR.syaratDetail = function (x) {
  const k = S.data.kantor;
  const poin = String(x.syarat || '').split('\n').map(t => t.trim()).filter(Boolean);
  const langkah = String(x.cara || '').split('\n').map(t => t.replace(/^\d+[.)]\s*/, '').trim()).filter(Boolean);
  const bar = h('span');
  const hitung = h('span', { class: 'kecil' });
  const daftarCek = h('ul', { class: 'cek-daftar' });
  const perbarui = () => {
    const semua = daftarCek.querySelectorAll('input');
    const siap = Array.prototype.filter.call(semua, c => c.checked).length;
    hitung.textContent = siap + ' dari ' + semua.length + ' siap';
    bar.style.width = (semua.length ? Math.round(siap / semua.length * 100) : 0) + '%';
  };
  poin.forEach((t, i) => {
    const sub = /^[–-]\s+/.test(t);
    const id = 'cek-' + i;
    daftarCek.append(h('li', { class: sub ? 'sub' : '' },
      h('label', { for: id }, h('input', { type: 'checkbox', id: id, onChange: perbarui }), h('span', { text: t.replace(/^[–-]\s+/, '') }))));
  });
  perbarui();
  return h('main', { class: 'layar' },
    h('header', { class: 'kepala' },
      h('span', { class: 'lencana', text: x.kategori }),
      h('h2', { text: x.layanan }),
      x.ringkasan ? h('p', { class: 'kecil', text: x.ringkasan }) : null),
    poin.length ? h('section', { class: 'kartu blok' },
      h('div', { class: 'blok-judul' }, h('h3', null, ikon('dokumen'), 'Dokumen yang disiapkan'), hitung),
      h('div', { class: 'progres', 'aria-hidden': 'true' }, bar),
      h('p', { class: 'kecil', text: 'Centang dokumen yang sudah Anda siapkan.' }),
      daftarCek) : null,
    langkah.length ? h('section', { class: 'kartu blok' },
      h('div', { class: 'blok-judul' }, h('h3', null, ikon('alur'), 'Cara mengajukan')),
      h('ol', { class: 'langkah-daftar' }, langkah.map(t => h('li', null, h('span', { text: t }))))) : null,
    x.waktu ? h('dl', { class: 'kartu rinci' }, h('dt', { text: 'Lama proses' }), h('dd', { text: x.waktu })) : null,
    x.catatan ? h('div', { class: 'catatan' }, ikon('catatan'), h('span', { class: 'pra', text: x.catatan })) : null,
    h('div', { class: 'deret' },
      h('button', { class: 'tombol tombol-kedua', onClick: () => bukaTautan(k.formulir) }, 'Formulir', ikon('tautan')),
      /^https?:\/\//.test(x.sumber) ? h('button', { class: 'tombol tombol-kedua', onClick: () => bukaTautan(x.sumber) }, 'Sumber', ikon('tautan')) : null),
    h('button', { class: 'tombol tombol-utama lebar', onClick: () => buka('form', { layanan: tebakLayanan(x.layanan), uraian: 'Permohonan: ' + x.layanan + '\n' }) }, 'Ajukan lewat antrean'),
    h('p', { class: 'kecil', text: 'Persyaratan dapat berbeda untuk kasus tertentu; petugas akan mengonfirmasi saat Anda dilayani.' }));
};
function tebakLayanan(nama) {
  const n = nama.toLowerCase();
  const peta = [[/sanksi/, 'P'], [/pkp|faktur/, 'F'], [/spt|stp/, 'S'], [/efin|sertifikat|password/, 'C'], [/npwp|nik|data|efektif|pemindahan|kuasa/, 'N'], [/ssp|pemindahbukuan|ppystt|skb/, 'K']];
  for (const [re, kode] of peta) if (re.test(n) && kodeLayanan(kode)) return kode;
  return kodeLayanan('K');
}

/* ---------- antrean saya ---------- */
LAYAR.status = function () {
  const list = S.data.tiketSaya;
  if (!list.length) {
    return h('main', { class: 'layar' },
      kepala('Antrean saya'),
      h('div', { class: 'kartu' }, h('p', { text: 'Tidak ada antrean aktif.' })),
      h('button', { class: 'tombol tombol-utama lebar', onClick: () => gantiDengan('form') }, 'Ambil antrean'));
  }
  return h('main', { class: 'layar' },
    kepala('Antrean saya', 'Petugas membalas lewat chat Telegram.'),
    list.map(t => karcis(t, { aksi: h('button', { class: 'tombol tombol-bahaya', style: 'min-height:44px', onClick: () => batal(t) }, 'Batalkan antrean') })),
    h('button', { class: 'tombol tombol-garis lebar', onClick: muatUlang }, 'Muat ulang'));
};
function batal(t) {
  const lanjut = async ok => {
    if (!ok) return;
    render(layarMemuat('Membatalkan…'));
    try {
      const r = await api('batalTiket', { kunci: t.kunci });
      if (!r.ok) throw new Error(r.pesan);
      getar('success');
      await muatUlang();
    } catch (e) { tampil(); tg.showAlert ? tg.showAlert(e.message || 'Gagal membatalkan.') : alert(e.message); }
  };
  const tanya = t.status === 'Dilayani'
    ? 'Antrean ' + t.id + ' sedang dilayani petugas. Tetap batalkan?'
    : 'Batalkan antrean ' + t.id + '?';
  if (tg.showConfirm) tg.showConfirm(tanya, lanjut); else lanjut(confirm(tanya));
}
async function muatUlang() {
  render(layarMemuat());
  try {
    const r = await api('awal', { mode: 'status' });
    if (r.ok) { S.data = r; simpanUmum(r); }
  } catch (e) {}
  tampil();
}

/* ---------- petugas: kirim kode billing ---------- */
LAYAR.billing = function (kunci) {
  const wadah = h('main', { class: 'layar' }, layarMemuat('Memuat tiket…'));
  api('detailTiket', { kunci: kunci }).then(r => {
    if (!r.ok) { wadah.replaceChildren(...LAYAR.galat({ pesan: r.pesan }).childNodes); return; }
    wadah.replaceChildren(formBilling(r));
  }).catch(() => wadah.replaceChildren(...LAYAR.galat({ pesan: 'Tidak dapat terhubung ke server.', ulang: true }).childNodes));
  return wadah;
};
function formBilling(r) {
  const t = r.tiket;
  const entri = [];
  let seq = 0;
  const wadahEntri = h('div', { class: 'daftar' });
  const iBerlaku = h('input', { class: 'isian', id: 'b-berlaku', type: 'datetime-local', value: nilaiLokal(new Date(Date.now() + r.masaBerlakuJam * 3600000)) });
  const banner = h('div', { role: 'alert' });
  const pDaftar = h('div', { style: 'display:flex;flex-direction:column;gap:6px' });
  const pJudul = h('div');
  const pBerlaku = h('div');
  const tombolTambah = h('button', { type: 'button', class: 'tombol tombol-kedua lebar', onClick: () => { const e = buatEntri(); e.iKode.focus(); } }, '+ Tambah kode billing');
  const tombol = h('button', { class: 'tombol tombol-utama lebar', type: 'submit' });

  function jenisDari(e) { return e.sJenis.value === '__lain' ? e.iJenisLain.value.trim() : e.sJenis.value; }
  function buatEntri() {
    const id = ++seq;
    const e = {};
    e.iKode = h('input', { class: 'isian mono besar', id: 'b-kode-' + id, inputmode: 'numeric', autocomplete: 'off', maxlength: '18', placeholder: '0000 0000 0000 000', 'aria-describedby': 'b-kode-h-' + id + ' b-kode-e-' + id });
    e.hKode = h('p', { class: 'bantuan', id: 'b-kode-h-' + id, text: '0 dari 15 digit' });
    e.eKode = h('p', { class: 'salah', id: 'b-kode-e-' + id });
    e.sJenis = h('select', { class: 'isian', id: 'b-jenis-' + id, 'aria-label': 'Jenis pajak' },
      h('option', { value: '', text: 'Jenis pajak (opsional)' }), r.jenisPajak.map(j => h('option', { value: j, text: j })), h('option', { value: '__lain', text: 'Lainnya…' }));
    e.iJenisLain = h('input', { class: 'isian', placeholder: 'Tulis jenis pajak', maxlength: '120', hidden: true, 'aria-label': 'Jenis pajak lainnya' });
    e.iJumlah = h('input', { class: 'isian', id: 'b-jumlah-' + id, inputmode: 'numeric', placeholder: 'Jumlah (opsional), mis. Rp20.000.000', autocomplete: 'off', 'aria-label': 'Jumlah' });
    e.judul = h('span', { class: 'label' });
    e.hapus = h('button', { type: 'button', class: 'tombol tombol-garis hapus', 'aria-label': 'Hapus kode ini', onClick: () => hapusEntri(e) }, 'Hapus');
    e.iKode.addEventListener('input', () => { e.iKode.value = kelompok(e.iKode.value, [4, 4, 4, 3]).slice(0, 18); e.eKode.textContent = ''; e.iKode.removeAttribute('aria-invalid'); perbarui(); jaga(true); });
    e.sJenis.addEventListener('change', () => { e.iJenisLain.hidden = e.sJenis.value !== '__lain'; if (!e.iJenisLain.hidden) e.iJenisLain.focus(); perbarui(); });
    e.iJenisLain.addEventListener('input', perbarui);
    e.iJumlah.addEventListener('input', () => { e.iJumlah.value = rupiah(e.iJumlah.value); perbarui(); });
    e.el = h('fieldset', { class: 'kartu entri' },
      h('div', { class: 'entri-judul' }, e.judul, e.hapus),
      h('div', { class: 'bidang' }, h('label', { class: 'sr', for: 'b-kode-' + id, text: 'Kode billing' }), e.iKode, e.hKode, e.eKode),
      e.sJenis, e.iJenisLain, e.iJumlah);
    entri.push(e);
    wadahEntri.append(e.el);
    nomori();
    perbarui();
    return e;
  }
  function hapusEntri(e) {
    if (entri.length === 1) return;
    entri.splice(entri.indexOf(e), 1);
    e.el.remove();
    nomori();
    perbarui();
  }
  function nomori() {
    entri.forEach((e, i) => { e.judul.textContent = 'Kode billing ' + (i + 1); e.hapus.hidden = entri.length === 1; });
    tombolTambah.hidden = entri.length >= 20;
  }
  function perbarui() {
    pDaftar.replaceChildren(...entri.map((e, i) => {
      const kode = digit(e.iKode.value);
      const ok = kode.length === 15;
      e.iKode.classList.toggle('valid', ok);
      e.hKode.className = 'bantuan' + (ok ? ' ok' : '');
      e.hKode.textContent = kode.length + ' dari 15 digit';
      const ket = [jenisDari(e), rupiah(e.iJumlah.value)].filter(Boolean).join(' · ');
      return h('div', null,
        h('div', { class: 'nomor', text: (entri.length > 1 ? (i + 1) + '. ' : '') + (kode ? kelompok(kode, [4, 4, 4, 3]) : '•••• •••• •••• •••') }),
        ket ? h('div', { class: 'kecil', text: ket }) : null);
    }));
    pJudul.replaceChildren('Yth. Bapak/Ibu ', h('b', { text: t.namaPemohon }), ', berikut ' + (entri.length > 1 ? entri.length + ' kode billing' : 'kode billing') + ' atas permohonan ', h('b', { text: t.id }), ':');
    pBerlaku.textContent = 'Berlaku s.d. ' + tglJam(iBerlaku.value) + ' WIB';
    tombol.textContent = entri.length > 1 ? 'Kirim ' + entri.length + ' kode ke ' + t.namaPemohon : 'Kirim ke ' + t.namaPemohon;
  }
  iBerlaku.addEventListener('input', perbarui);

  async function kirim(ev) {
    ev.preventDefault();
    banner.replaceChildren();
    const items = [];
    let pertamaSalah = null;
    entri.forEach(e => {
      const kode = digit(e.iKode.value);
      let pesan = '';
      if (kode.length !== 15) pesan = 'Kode billing harus 15 digit angka.';
      else if (items.some(x => x.kode === kode)) pesan = 'Kode ini sudah ditulis di atas.';
      e.eKode.textContent = pesan;
      if (pesan) { e.iKode.setAttribute('aria-invalid', 'true'); pertamaSalah = pertamaSalah || e.iKode; }
      else items.push({ kode, jenis: jenisDari(e), jumlah: digit(e.iJumlah.value) });
    });
    if (pertamaSalah) { pertamaSalah.focus(); getar('error'); return; }
    tombol.disabled = true; tombol.textContent = 'Mengirim…';
    try {
      const berlaku = iBerlaku.value ? new Date(iBerlaku.value).toISOString() : '';
      const res = await api('kirimBilling', { kunci: t.kunci, items, berlaku });
      if (!res.ok) throw new Error(res.pesan);
      getar('success'); jaga(false);
      gantiDengan('sukses', { jenis: 'billing', nama: t.namaPemohon, id: t.id, jumlah: items.length });
    } catch (e) {
      getar('error');
      banner.replaceChildren(h('div', { class: 'banner banner-galat', text: e.message || 'Gagal mengirim.' }));
      tombol.disabled = false; perbarui();
    }
  }

  buatEntri();
  const sisa = t.permintaan ? Math.max(0, t.permintaan - t.terkirim) : 0;
  for (let i = 1; i < Math.min(sisa, 5); i++) buatEntri();

  return h('form', { class: 'layar', novalidate: true, onSubmit: kirim },
    kepala('Kirim kode billing', t.id + ' · ' + t.layanan),
    h('dl', { class: 'kartu rinci' },
      h('dt', { text: 'Pemohon' }), h('dd', { text: t.namaPemohon + ' (' + t.selaku + ')' }),
      h('dt', { text: 'Nama WP' }), h('dd', { text: t.namaWP }),
      h('dt', { text: 'NPWP/NIK' }), h('dd', { class: 'nomor', text: kelompok(t.npwp, [4, 4, 4, 4]) }),
      t.permintaan ? [h('dt', { text: 'Billing' }), h('dd', { text: 'diminta ' + t.permintaan + ' · terkirim ' + t.terkirim })] : null,
      h('dt', { text: 'Uraian' }), h('dd', { style: 'font-weight:400', text: t.uraian })),
    t.kodeTerkirim.length ? h('div', { class: 'bidang' }, h('span', { class: 'label', text: 'Sudah terkirim' }),
      h('div', { class: 'daftar-kode' }, t.kodeTerkirim.map(k => h('span', { text: k })))) : null,
    h('p', { class: 'tip', text: 'Lebih cepat dengan file: kirim PDF kode billing langsung di topik tiket, kalimatnya dibuat otomatis. Formulir ini untuk mengetik kode.' }),
    wadahEntri,
    tombolTambah,
    h('div', { class: 'bidang' }, h('label', { class: 'label', for: 'b-berlaku', text: 'Berlaku sampai' }), iBerlaku,
      h('p', { class: 'bantuan', text: 'Otomatis ' + r.masaBerlakuJam / 24 + ' × 24 jam sejak sekarang (PER-8/PJ/2026). Ubah bila kode terbit lebih awal.' })),
    h('div', { class: 'bidang' }, h('span', { class: 'label', text: 'Pratinjau pesan untuk WP' }),
      h('div', { class: 'pratinjau' }, h('div', { class: 'gelembung' }, pJudul, pDaftar, pBerlaku,
        h('div', { class: 'kecil', text: 'Pembayaran melalui bank/pos persepsi, ATM, atau internet/mobile banking. Simpan BPN sebagai bukti setor.' })))),
    banner,
    h('div', { class: 'kaki' }, tombol));
}

/* ---------- mulai ---------- */
function mulai() {
  if (!tg || !tg.initData) {
    render(LAYAR.galat({ pesan: 'Halaman ini dibuka dari Telegram. Silakan buka lewat tombol Layanan di chat KPP.' }));
    return;
  }
  tg.ready();
  tg.expand();
  const tema = () => { document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light'; };
  tema();
  tg.onEvent('themeChanged', tema);
  try { tg.setHeaderColor('#0E2A47'); } catch (e) {}
  if (tg.BackButton) tg.BackButton.onClick(kembali);
  if (API_URL.indexOf('ISI_') === 0) {
    render(LAYAR.galat({ pesan: 'Alamat server (API_URL) belum diisi di index.html.' }));
    return;
  }
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') || (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || 'home';

  // Petugas: langsung buka formulir billing tanpa memuat data WP
  if (mode.indexOf('b_') === 0) {
    S.data = { kantor: {}, layanan: [], faq: [], syarat: [], tiketSaya: [] };
    S.riwayat = [{ layar: 'billing', arg: mode.slice(2) }];
    tampil();
    return;
  }

  const rute = mode.indexOf('n_') === 0 ? [{ layar: 'home' }, { layar: 'nilai', arg: mode.slice(2) }]
    : ['form', 'info', 'syarat', 'status', 'kalkulator'].indexOf(mode) >= 0 ? [{ layar: 'home' }, { layar: mode }] : [{ layar: 'home' }];
  const simpanan = bacaSimpanan();
  if (simpanan) {
    // tampil seketika memakai data umum yang tersimpan, data terbaru menyusul
    S.data = Object.assign({ tiketSaya: [], profil: null, perluIzinTulis: true }, simpanan);
    S.riwayat = rute;
    tampil();
  } else {
    render(layarMemuat());
  }
  S.janjiAwal = api('awal', { mode: mode }).then(r => {
    S.janjiAwal = null;
    if (!r.ok) { if (!simpanan) render(LAYAR.galat({ pesan: r.pesan, ulang: true })); return; }
    S.data = r;
    S.dataSegar = true;
    simpanUmum(r);
    if (!simpanan) { S.riwayat = rute; tampil(); return; }
    const cur = S.riwayat[S.riwayat.length - 1].layar;
    if (cur === 'home' || cur === 'status' || (cur === 'form' && r.jam && r.jam.buka === false)) tampil();
    else if (S.saatSegar) S.saatSegar(r);
  }).catch(() => {
    S.janjiAwal = null;
    if (!simpanan) render(LAYAR.galat({ pesan: 'Tidak dapat terhubung ke server. Periksa koneksi internet lalu coba lagi.', ulang: true }));
  });
}
mulai();
